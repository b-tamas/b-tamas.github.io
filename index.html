<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Software Quality Specialist focused on quality and clarity."
    />
    <meta name="theme-color" content="#031126" />
    <link rel="canonical" href="https://b-tamas.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://b-tamas.github.io/" />
    <meta property="og:title" content="Software Quality Specialist" />
    <meta
      property="og:description"
      content="Driving software quality. Cutting through digital noise."
    />
    <meta
      property="og:image"
      content="https://b-tamas.github.io/assets/lighthouse_jpg.jpg"
    />
    <meta property="og:image:alt" content="Lighthouse on the coast" />
    <title>Software Quality Specialist</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tamás Bakai",
        "url": "https://b-tamas.github.io/",
        "jobTitle": "Software Quality Specialist",
        "description": "Driving software quality. Cutting through digital noise.",
        "sameAs": [
          "https://github.com/b-tamas",
          "https://www.linkedin.com/in/tamas-bakai/"
        ]
      }
    </script>
    <style>
      :root {
        color: #eef7ff;
        background: #031126;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .lighthouse {
        display: block;
        width: 100%;
        height: auto;
      }

      .content {
        padding: clamp(2rem, 6vw, 5rem);
        background: #031126;
      }

      .content-inner {
        width: min(100%, 760px);
      }

      .role {
        margin: 0 0 1rem;
        color: #86d7ff;
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .slogan {
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 5rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .github-link {
        display: inline-block;
        color: #031126;
        font-weight: 750;
        text-decoration: none;
        background: #d9f4ff;
        border-radius: 999px;
        padding: 0.9rem 1.15rem;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .github-link:hover,
      .github-link:focus-visible {
        background: #ffffff;
      }

      .github-link:focus-visible {
        outline: 3px solid #86d7ff;
        outline-offset: 3px;
      }

      .linkedin-link {
        display: inline-grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        color: #ffffff;
        font-family: Arial, sans-serif;
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
        background: #0a66c2;
        border-radius: 0.25rem;
      }

      .linkedin-link:hover,
      .linkedin-link:focus-visible {
        background: #004182;
      }

      .linkedin-link:focus-visible {
        outline: 3px solid #86d7ff;
        outline-offset: 3px;
      }

      @media (min-width: 1100px) {
        main {
          position: relative;
        }

        .content {
          position: absolute;
          inset: 0 auto 0 0;
          display: grid;
          align-items: end;
          width: 33.333%;
          padding: clamp(2rem, 3vw, 4rem);
          background: rgba(0, 0, 0, 0.72);
        }

        .content-inner {
          width: 100%;
        }

        .slogan {
          font-size: clamp(2.25rem, 3.5vw, 4rem);
        }
      }

      @media (max-width: 360px) {
        .content {
          padding: 1.25rem;
        }

        .role {
          font-size: 0.7rem;
          letter-spacing: 0.12em;
        }

        .slogan {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="lighthouse"
        src="assets/lighthouse_jpg.jpg"
        alt="Lighthouse on the coast"
      />
      <section class="content" aria-labelledby="site-title">
        <div class="content-inner">
          <h1 id="site-title" class="role">Software Quality Specialist</h1>
          <p class="slogan">Driving software quality. Cutting through digital noise.</p>
          <div class="social-links">
            <a class="github-link" href="https://github.com/b-tamas">
              Explore my GitHub
            </a>
            <a
              class="linkedin-link"
              href="https://www.linkedin.com/in/tamas-bakai/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Tamás Bakai on LinkedIn (opens in a new tab)"
            >
              <span aria-hidden="true">in</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
