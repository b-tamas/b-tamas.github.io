<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A software architect focused on quality and clarity." />
    <meta name="theme-color" content="#031126" />
    <title>Software Architect</title>
    <style>
      :root {
        --ink: #eef7ff;
        --accent: #86d7ff;
        --surface: rgba(3, 16, 35, 0.6);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #031126;
      }
      .hero {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        padding: 2rem;
        isolation: isolate;
        background:
          linear-gradient(90deg, rgba(2, 10, 25, 0.78), rgba(2, 10, 25, 0.2)),
          url("assets/lighthouse.jpg") center / cover no-repeat,
          url("assets/lighthouse-placeholder.svg") center / cover no-repeat,
          #031126;
      }
      .hero::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 50% 42%, rgba(137, 218, 255, 0.18), transparent 28%),
          linear-gradient(180deg, rgba(0, 8, 22, 0.08), rgba(0, 8, 22, 0.72));
      }
      .content {
        width: min(100%, 760px);
        margin-right: auto;
        padding: clamp(1.5rem, 5vw, 4rem);
        border: 1px solid rgba(180, 229, 255, 0.22);
        border-radius: 1.25rem;
        background: var(--surface);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.38);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        animation: rise 700ms ease-out both;
      }
      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.6rem, 7vw, 5.6rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 2.2rem;
        padding: 0.9rem 1.15rem;
        border: 1px solid rgba(184, 233, 255, 0.56);
        border-radius: 999px;
        color: #04101f;
        font-weight: 750;
        text-decoration: none;
        background: #d9f4ff;
        transition: transform 160ms ease, background 160ms ease;
      }
      .cta:hover,
      .cta:focus-visible {
        background: #ffffff;
        transform: translateY(-2px);
      }
      .cta:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .cta span { font-size: 1.2em; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
      @media (max-width: 640px) {
        .hero {
          align-items: end;
          padding: 1rem;
          background-position: 58% center;
        }
        .content { padding: 1.5rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .content { animation: none; }
        .cta { transition: none; }
        .cta:hover, .cta:focus-visible { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <section class="content" aria-label="Introduction">
        <p class="eyebrow">Software Architect</p>
        <h1>Driving software quality. Cutting through digital noise.</h1>
        <a class="cta" href="https://github.com/b-tamas" target="_blank" rel="noopener noreferrer">
          Explore my GitHub <span aria-hidden="true">↗</span>
        </a>
      </section>
    </main>
  </body>
</html>
